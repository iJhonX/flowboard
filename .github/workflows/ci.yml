name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      MONGODB_URI: ${{ secrets.TEST_MONGODB_URI }}
      JWT_SECRET: ci-jwt-secret
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Los tests de integración usan bases de datos reales: solo corren si el
      # repo tiene configurados los secrets TEST_DATABASE_URL y TEST_MONGODB_URI
      # (idealmente apuntando a una base de pruebas, no a la de producción).
      - name: Tests
        if: ${{ env.DATABASE_URL != '' && env.MONGODB_URI != '' }}
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_API_URL: http://localhost:4000
          VITE_SOCKET_URL: http://localhost:4000
